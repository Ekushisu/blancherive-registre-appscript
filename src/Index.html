    /* EFFECTIFS V2 : onglets par corps + édition complète */
    .effectifs-tabs{
      display:flex;
      gap:7px;
      overflow-x:auto;
      padding:2px 0 12px;
      margin-bottom:12px;
      scrollbar-width:thin;
    }
    .effectifs-tab{
      border:1px solid #bbb;
      background:#fff;
      color:#444;
      border-radius:999px;
      padding:8px 11px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      white-space:nowrap;
    }
    .effectifs-tab:hover{background:#f4f4f4}
    .effectifs-tab.active{
      background:#333;
      border-color:#333;
      color:#fff;
    }
    .effectifs-tab-count{
      min-width:22px;
      padding:2px 6px;
      border-radius:999px;
      background:rgba(0,0,0,.08);
      font-size:11px;
      text-align:center;
    }
    .effectifs-tab.active .effectifs-tab-count{
      background:rgba(255,255,255,.16);
    }
    .effectifs-empty{
      background:#fff;
      border:1px dashed #bbb;
      border-radius:11px;
      padding:24px;
      text-align:center;
      color:#777;
    }
    .effectif-edit-grid{
      display:grid;
      grid-template-columns:
        minmax(150px,.9fr)
        minmax(190px,1.15fr)
        minmax(180px,1fr)
        minmax(170px,1fr)
        auto
        auto;
      gap:10px;
      align-items:end;
    }

  
    /* ======================================================
       EFFECTIFS V3 - lisibilité / regroupement / couleurs
       ====================================================== */

    .effectifs-tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 0 12px;
      margin-bottom: 10px;
      scrollbar-width: thin;
    }

    .effectifs-tab {
      border: 1px solid #bbb;
      background: white;
      color: #444;
      border-radius: 999px;
      padding: 8px 11px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      min-height: 40px;
    }

    .effectifs-tab:hover {
      background: #f3f3f3;
    }

    .effectifs-tab.active {
      border-color: #444;
      background: #eee;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    }

    .effectifs-tab-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.14);
      background: #ddd;
      flex: 0 0 auto;
    }

    .effectifs-tab-count {
      min-width: 22px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(0,0,0,.08);
      font-size: 11px;
      text-align: center;
    }

    .effectifs-toolbar-v3 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 16px;
    }

    .effectifs-total {
      display: flex;
      flex-direction: column;
      gap: 2px;
      white-space: nowrap;
    }

    .effectifs-total span {
      color: #777;
      font-size: 12px;
    }

    .effectifs-search {
      width: min(460px,100%);
      min-height: 40px;
      border: 1px solid #aaa;
      border-radius: 7px;
      padding: 8px 10px;
      background: white;
    }

    .effectifs-corps-groups {
      display: grid;
      gap: 24px;
    }

    .effectifs-corps-group {
      display: grid;
      gap: 10px;
    }

    .effectifs-corps-heading {
      border-left: 5px solid #777;
      padding: 4px 0 4px 12px;
    }

    .effectifs-corps-title {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.15;
    }

    .effectifs-corps-subtitle {
      margin-top: 3px;
      color: #777;
      font-size: 12px;
    }

    .effectifs-grade-groups {
      display: grid;
      gap: 12px;
    }

    .effectifs-grade-group {
      background: white;
      border: 1px solid #cfcfcf;
      border-radius: 11px;
      overflow: hidden;
    }

    .effectifs-grade-heading {
      min-height: 39px;
      padding: 8px 13px;

      align-items: center;

      gap: 12px;
      border-bottom: 1px solid rgba(0,0,0,.10);
      font-weight: 800;
    }

    .effectifs-grade-count {
      min-width: 25px;
      padding: 3px 7px;

      background: rgba(255,255,255,.34);
      border: 1px solid rgba(0,0,0,.12);
      font-size: 11px;
      text-align: center;
    }

    .effectifs-member-list {
      display: grid;
    }

    .effectif-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 11px 13px;
      border-bottom: 1px solid #ededed;
    }

    .effectif-row:last-child {
      border-bottom: 0;
    }

    .effectif-row:hover {
      background: #fafafa;
    }

    .effectif-identity {
      min-width: 0;
    }

    .effectif-name {
      font-size: 15px;
      font-weight: 750;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .effectif-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }

    .effectif-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.12);
      background: #eee;
      color: #555;
      font-size: 11px;
      line-height: 1;
      white-space: nowrap;
    }

    .effectif-badge-sworn {
      background: #e2f0d9;
      color: #35652f;
      border-color: #b7d4ad;
    }

    .effectif-badge-muted {
      background: #f1f1f1;
      color: #888;
      border-color: #ddd;
    }

    .effectif-edit-button {
      min-width: 90px;
    }

    .effectif-editor {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns:
        minmax(140px,.8fr)
        minmax(185px,1.05fr)
        minmax(170px,1fr)
        minmax(170px,1fr)
        auto
        auto;
      gap: 10px;
      align-items: end;
      margin-top: 3px;
      padding-top: 12px;
      border-top: 1px dashed #ddd;
    }

    .effectif-editor select,
    .effectif-editor input {
      width: 100%;
      min-height: 40px;
      border: 1px solid #aaa;
      border-radius: 7px;
      padding: 7px 9px;
    }

    .effectif-editor-check {
      min-height: 40px;
      margin: 0;
    }

    .effectif-editor-actions {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .effectifs-empty {
      background: white;
      border: 1px dashed #bbb;
      border-radius: 11px;
      padding: 24px;
      text-align: center;
      color: #777;
    }

    @media(max-width:1200px) {
      .effectif-editor {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    @media(max-width:760px) {
      .effectifs-toolbar-v3 {
        align-items: stretch;
        flex-direction: column;
      }

      .effectifs-search {
        width: 100%;
      }

      .effectifs-tabs {
        margin-left: -12px;
        margin-right: -12px;
        padding-left: 12px;
        padding-right: 12px;
      }

      .effectif-row {
        grid-template-columns: 1fr;
      }

      .effectif-edit-button {
        width: 100%;
      }

      .effectif-editor {
        grid-template-columns: 1fr;
      }

      .effectif-editor-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
    }

  
    .effectifs-reserve-group {
      border-style: dashed;

    }

    .effectifs-reserve-group .effectifs-grade-heading {

    .effectifs-archives-title {
      font-size: 20px;

    .effectifs-archives-subtitle {

    .effectifs-terminal-groups {

    }

<div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useRef,useState}=React;

function serverCall(name,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error?.message||String(error))))[name](...args);});}
function normalizeSearchText(value){return String(value||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function formatHours(value){const n=Number(value);if(!Number.isFinite(n))return"";if(n<1)return`${Math.round(n*60)} min`;if(Number.isInteger(n))return`${n} h`;const h=Math.floor(n),m=Math.round((n-h)*60);return`${h} h ${m} min`;}
function formatSeptims(value){const n=Number(value)||0;return`${new Intl.NumberFormat("fr-FR").format(n)} septim${Math.abs(n)>1?"s":""}`;}
function findCodexArticle(articles,label){if(!articles||!label)return null;const exact=articles.find(a=>a.label===label);if(exact)return exact;const m=String(label).match(/Art\.?\s*([0-9IVXLCDM.\-]+)/i);if(!m)return null;return articles.find(a=>String(a.article).toLowerCase()===String(m[1]).toLowerCase()&&a.source==="Codex Judiciaire de Blancherive")||null;}

function App(){
  const[token,setToken]=useState(sessionStorage.getItem("guardAuthToken"));
  const[role,setRole]=useState(null);const[page,setPage]=useState("organigramme");const[codexFocus,setCodexFocus]=useState(null);
  useEffect(()=>{if(!token)return;serverCall("getSessionInfo",token).then(i=>setRole(i.role)).catch(logout);},[token]);
  function logout(){sessionStorage.removeItem("guardAuthToken");setToken(null);setRole(null);setPage("organigramme");}
  if(!token)return <Login onLogin={t=>{sessionStorage.setItem("guardAuthToken",t);setToken(t);}}/>;
  if(!role)return <div className="loading">Chargement...</div>;
  return <div className="app"><Header role={role} page={page} onPage={setPage} onLogout={logout}/><main className="content">
    {page==="organigramme"&&<OrganigrammePage token={token}/>} 
    {page==="effectifs"&&role==="OFFICIER"&&<EffectifsPage token={token}/>} 
    {page==="presences"&&<PresencesPage token={token} canEdit={role==="OFFICIER"}/>} 
    {page==="codex"&&<CodexPage token={token} focusArticle={codexFocus} onFocusConsumed={()=>setCodexFocus(null)}/>} 
    {page==="amendes"&&<AmendesPage token={token} canDelete={role==="OFFICIER"} onOpenCodex={a=>{setCodexFocus(a);setPage("codex");}}/>}
    {page==="prison"&&<PrisonPage token={token} canDelete={role==="OFFICIER"} onOpenCodex={a=>{setCodexFocus(a);setPage("codex");}}/>}
  </main></div>;
}

function Login({onLogin}){const[password,setPassword]=useState("");const[error,setError]=useState("");async function submit(e){e.preventDefault();try{setError("");onLogin(await serverCall("login",password));}catch(e){setError(e.message);}}return <div className="login-page"><form className="login-card" onSubmit={submit}><h1>Registre de la Garde</h1><p>Garde de Blancherive</p><input type="password" placeholder="Mot de passe" value={password} onChange={e=>setPassword(e.target.value)}/><button className="primary-button">Entrer</button>{error&&<div className="error">{error}</div>}</form></div>;}
function Header({role,page,onPage,onLogout}){const pages=[["organigramme","Organigramme"],...(role==="OFFICIER"?[["effectifs","Effectifs"]]:[]),["presences","Présences"],["codex","Codex"],["amendes","Amendes"],["prison","Prison"]];return <header className="topbar"><div className="brand">Garde de Blancherive</div><nav className="nav">{pages.map(([k,l])=><button key={k} className={page===k?"active":""} onClick={()=>onPage(k)}>{l}</button>)}</nav><span className="role-badge">{role}</span><button className="logout" onClick={onLogout}>Déconnexion</button></header>;}

function effectifsStyle(style,fallback={}){
  if(!style)return fallback;

  return {
    ...fallback,
    ...(style.background
      ?{backgroundColor:style.background}
      :{}),
    ...(style.color
      ?{color:style.color}
      :{}),
    ...(style.fontWeight
      ?{fontWeight:style.fontWeight}
      :{})
  };
}

function EffectifsPage({token}){
  const[data,setData]=useState(null);
  const[search,setSearch]=useState("");
  const[activeCorps,setActiveCorps]=useState("ALL");
  const[showForm,setShowForm]=useState(false);
  const[error,setError]=useState("");
  const[success,setSuccess]=useState("");

  useEffect(()=>{
    serverCall(
      "getEffectifs",
      token
    )
      .then(setData)
      .catch(e=>
        setError(
          e.message
        )
      );
  },[]);

  /*
    Les quatre groupes de sortie définitive sont trans-corps :
    ils ne participent pas aux onglets de corps.
  */
  const activeRows=useMemo(()=>{
    if(!data){
      return[];
    }

    return data.rows.filter(
      member=>
        !member.terminalGroup
    );
  },[data]);

  const terminalRows=useMemo(()=>{
    if(!data){
      return[];
    }

    return data.rows.filter(
      member=>
        Boolean(
          member.terminalGroup
        )
    );
  },[data]);

  const corpsTabs=useMemo(()=>{
    if(!data){
      return[];
    }

    const values=[
      ...data.options.corps
    ];

    activeRows.forEach(member=>{
      if(
        member.corps &&
        !values.includes(
          member.corps
        )
      ){
        values.push(
          member.corps
        );
      }
    });

    return values;
  },[
    data,
    activeRows
  ]);

  const filteredActive=useMemo(()=>{
    const q=
      normalizeSearchText(
        search
      );

    return activeRows.filter(member=>{
      if(
        activeCorps!=="ALL" &&
        member.corps!==activeCorps
      ){
        return false;
      }

      if(!q){
        return true;
      }

      return normalizeSearchText([
        member.prenom,
        member.nom,
        member.grade,
        member.corps,
        member.specialite,
        member.status,
        member.assermente
          ?"assermente"
          :"non assermente",
        member.reserve
          ?"reserve"
          :""
      ].join(" "))
        .includes(q);
    });
  },[
    activeRows,
    search,
    activeCorps
  ]);

  /*
    Les groupes Morts / Radiés / Démissionnaires / Déserteurs
    restent toujours à la fin de la page, quel que soit l'onglet
    de corps sélectionné. La recherche, elle, s'applique aussi à eux.
  */
  const filteredTerminal=useMemo(()=>{
    const q=
      normalizeSearchText(
        search
      );

    if(!q){
      return terminalRows;
    }

    return terminalRows.filter(member=>
      normalizeSearchText([
        member.prenom,
        member.nom,
        member.grade,
        member.corps,
        member.specialite,
        member.status,
        member.terminalGroup
      ].join(" "))
        .includes(q)
    );
  },[
    terminalRows,
    search
  ]);

  const groupedByCorps=useMemo(()=>{
    if(!data){
      return[];
    }

    const corpsMap=
      new Map();

    filteredActive.forEach(member=>{
      const corps=
        member.corps||
        "Sans corps";

      if(
        !corpsMap.has(corps)
      ){
        corpsMap.set(
          corps,
          {
            active:new Map(),
            reserve:[]
          }
        );
      }

      const group=
        corpsMap.get(corps);

      if(member.reserve){
        group.reserve.push(
          member
        );
        return;
      }

      const grade=
        member.grade||
        "Sans grade";

      if(
        !group.active.has(
          grade
        )
      ){
        group.active.set(
          grade,
          []
        );
      }

      group.active
        .get(grade)
        .push(member);
    });

    const gradeOrder=
      data.gradeOrder||[];

    function sortMembers(members){
      return members.sort(
        (a,b)=>
          a.nomComplet.localeCompare(
            b.nomComplet,
            "fr"
          )
      );
    }

    return [...corpsMap.entries()]
      .sort(
        ([a],[b])=>
          a.localeCompare(
            b,
            "fr"
          )
      )
      .map(([corps,group])=>{
        const normalGroups=
          [...group.active.entries()]
            .sort(
              ([gradeA],[gradeB])=>{
                const a=
                  gradeOrder.indexOf(
                    gradeA
                  );

                const b=
                  gradeOrder.indexOf(
                    gradeB
                  );

                if(
                  a>=0 &&
                  b>=0
                ){
                  return a-b;
                }

                if(a>=0){
                  return -1;
                }

                if(b>=0){
                  return 1;
                }

                return gradeA.localeCompare(
                  gradeB,
                  "fr"
                );
              }
            )
            .map(
              ([grade,members])=>({
                type:"grade",
                grade,
                members:
                  sortMembers(
                    members
                  )
              })
            );

        /*
          Réserve vient désormais APRÈS TOUS les grades,
          y compris après Aspirant-Garde / Recrue.
        */
        if(
          group.reserve.length
        ){
          normalGroups.push({
            type:"reserve",
            grade:"Réserve",
            members:
              sortMembers(
                group.reserve
              )
          });
        }

        return{
          corps,
          groups:
            normalGroups
        };
      });
  },[
    data,
    filteredActive
  ]);

  const terminalGroups=useMemo(()=>{
    if(!data){
      return[];
    }

    const order=[
      "Morts",
      "Radiés",
      "Démissionnaires",
      "Déserteurs"
    ];

    const gradeOrder=
      data.gradeOrder||[];

    return order
      .map(label=>{
        const members=
          filteredTerminal
            .filter(
              member=>
                member.terminalGroup===label
            )
            .sort((a,b)=>{
              const gradeA=
                gradeOrder.indexOf(
                  a.grade
                );

              const gradeB=
                gradeOrder.indexOf(
                  b.grade
                );

              if(
                gradeA>=0 &&
                gradeB>=0 &&
                gradeA!==gradeB
              ){
                return gradeA-gradeB;
              }

              if(gradeA>=0){
                return -1;
              }

              if(gradeB>=0){
                return 1;
              }

              return a.nomComplet.localeCompare(
                b.nomComplet,
                "fr"
              );
            });

        return{
          label,
          members
        };
      })
      .filter(
        group=>
          group.members.length>0
      );
  },[
    data,
    filteredTerminal
  ]);

  if(
    error &&
    !data
  ){
    return(
      <div className="error">
        Erreur Effectifs : {error}
      </div>
    );
  }

  if(!data){
    return(
      <div className="loading">
        Chargement des effectifs...
      </div>
    );
  }

  const countForCorps=corps=>
    corps==="ALL"
      ?activeRows.length
      :activeRows.filter(
        member=>
          member.corps===corps
      ).length;

  return(
    <>
      <div className="page-header">
        <div>
          <h1 className="page-title">
            Effectifs
          </h1>

          <p className="page-subtitle">
            Gestion des membres de la Garde — officiers uniquement.
          </p>
        </div>

        <button
          className="primary-button"
          onClick={()=>{
            setShowForm(
              !showForm
            );
            setError("");
            setSuccess("");
          }}
        >
          {showForm
            ?"Fermer"
            :"+ Nouveau membre"
          }
        </button>
      </div>

      <div className="info-notice">
        Les membres courants sont regroupés par corps puis par grade.
        La Réserve apparaît à la fin de chaque corps, après tous les grades.
        Les morts, radiés, démissionnaires et déserteurs sont regroupés
        séparément tout en bas de la page, indépendamment de leur corps.
      </div>

      {error&&
        <div className="error">
          {error}
        </div>
      }

      {success&&
        <div className="success">
          {success}
        </div>
      }

      {showForm&&
        <NouvelEffectifForm
          options={data.options}
          initialCorps={
            activeCorps==="ALL"
              ?""
              :activeCorps
          }
          onSubmit={async form=>{
            try{
              setError("");

              const refreshed=
                await serverCall(
                  "ajouterEffectif",
                  token,
                  form
                );

              setData(
                refreshed
              );

              setShowForm(
                false
              );

              if(form.corps){
                setActiveCorps(
                  form.corps
                );
              }

              setSuccess(
                `${`${form.prenom} ${form.nom}`.trim()} a été ajouté aux effectifs.`
              );
            }catch(e){
              setError(
                e.message
              );
            }
          }}
        />
      }

      <div
        className="effectifs-tabs"
        role="tablist"
        aria-label="Corps de garde"
      >
        <button
          type="button"
          className={
            `effectifs-tab ${
              activeCorps==="ALL"
                ?"active"
                :""
            }`
          }
          onClick={()=>
            setActiveCorps(
              "ALL"
            )
          }
        >
          Tous

          <span className="effectifs-tab-count">
            {countForCorps(
              "ALL"
            )}
          </span>
        </button>

        {corpsTabs.map(corps=>{
          const style=
            data.options
              .styles
              ?.corps
              ?.[corps];

          return(
            <button
              type="button"
              key={corps}
              className={
                `effectifs-tab ${
                  activeCorps===corps
                    ?"active"
                    :""
                }`
              }
              onClick={()=>
                setActiveCorps(
                  corps
                )
              }
            >
              <span
                className="effectifs-tab-dot"
                style={
                  style?.background
                    ?{
                        backgroundColor:
                          style.background
                      }
                    :undefined
                }
              />

              {corps}

              <span className="effectifs-tab-count">
                {countForCorps(
                  corps
                )}
              </span>
            </button>
          );
        })}
      </div>

      <div className="effectifs-toolbar-v3">
        <div className="effectifs-total">
          <strong>
            {activeCorps==="ALL"
              ?"Tous les corps"
              :activeCorps
            }
          </strong>

          <span>
            {filteredActive.length} membre
            {filteredActive.length!==1
              ?"s"
              :""
            }
          </span>
        </div>

        <input
          className="effectifs-search"
          type="search"
          placeholder="Rechercher nom, grade, spécialité, statut..."
          value={search}
          onChange={e=>
            setSearch(
              e.target.value
            )
          }
        />
      </div>

      <div className="effectifs-corps-groups">
        {groupedByCorps.length===0&&
          <div className="effectifs-empty">
            Aucun membre avec les filtres actuels.
          </div>
        }

        {groupedByCorps.map(corpsGroup=>{
          const corpsStyle=
            data.options
              .styles
              ?.corps
              ?.[corpsGroup.corps];

          const total=
            corpsGroup.groups.reduce(
              (sum,group)=>
                sum+
                group.members.length,
              0
            );

          return(
            <section
              className="effectifs-corps-group"
              key={
                corpsGroup.corps
              }
            >
              <div
                className="effectifs-corps-heading"
                style={
                  corpsStyle?.background
                    ?{
                        borderLeftColor:
                          corpsStyle.background
                      }
                    :undefined
                }
              >
                <div>
                  <div className="effectifs-corps-title">
                    {corpsGroup.corps}
                  </div>

                  <div className="effectifs-corps-subtitle">
                    {total} membre
                    {total!==1?"s":""}
                  </div>
                </div>
              </div>

              <div className="effectifs-grade-groups">
                {corpsGroup.groups.map(group=>{
                  const gradeStyle=
                    group.type==="reserve"
                      ?{
                          background:"#e6e6e6",
                          color:"#555555",
                          fontWeight:"700"
                        }
                      :data.options
                        .styles
                        ?.grades
                        ?.[group.grade];

                  return(
                    <section
                      className={
                        `effectifs-grade-group ${
                          group.type==="reserve"
                            ?"effectifs-reserve-group"
                            :""
                        }`
                      }
                      key={
                        `${group.type}-${group.grade}`
                      }
                    >
                      <div
                        className="effectifs-grade-heading"
                        style={
                          effectifsStyle(
                            gradeStyle,
                            {}
                          )
                        }
                      >
                        <span>
                          {group.type==="reserve"
                            ?"Réserve"
                            :group.grade
                          }
                        </span>

                        <span className="effectifs-grade-count">
                          {group.members.length}
                        </span>
                      </div>

                      <div className="effectifs-member-list">
                        {group.members.map(member=>
                          <EffectifCard
                            key={
                              `${member.row}-${member.prenom}-${member.nom}`
                            }
                            member={
                              member
                            }
                            options={
                              data.options
                            }
                            onSave={
                              async values=>{
                                try{
                                  setError("");
                                  setSuccess("");

                                  const refreshed=
                                    await serverCall(
                                      "modifierEffectif",
                                      token,
                                      {
                                        row:
                                          member.row,

                                        expectedPrenom:
                                          member.prenom,

                                        expectedNom:
                                          member.nom,

                                        grade:
                                          values.grade,

                                        corps:
                                          values.corps,

                                        specialite:
                                          values.specialite,

                                        status:
                                          values.status,

                                        assermente:
                                          values.assermente
                                      }
                                    );

                                  setData(
                                    refreshed
                                  );

                                  setSuccess(
                                    `${member.nomComplet} a été mis à jour.`
                                  );
                                }catch(e){
                                  setError(
                                    e.message
                                  );
                                }
                              }
                            }
                          />
                        )}
                      </div>
                    </section>
                  );
                })}
              </div>
            </section>
          );
        })}
      </div>

      {terminalGroups.length>0&&
        <section className="effectifs-archives">
          <div className="effectifs-archives-heading">
            <div>
              <div className="effectifs-archives-title">
                Anciens membres
              </div>

              <div className="effectifs-archives-subtitle">
                Groupes trans-corps — conservés au registre
              </div>
            </div>
          </div>

          <div className="effectifs-terminal-groups">
            {terminalGroups.map(group=>
              <section
                className={
                  `effectifs-grade-group effectifs-terminal-group effectifs-terminal-${normalizeSearchText(group.label)}`
                }
                key={group.label}
              >
                <div className="effectifs-terminal-heading">
                  <span>
                    {group.label}
                  </span>

                  <span className="effectifs-grade-count">
                    {group.members.length}
                  </span>
                </div>

                <div className="effectifs-member-list">
                  {group.members.map(member=>
                    <EffectifCard
                      key={
                        `terminal-${member.row}-${member.prenom}-${member.nom}`
                      }
                      member={
                        member
                      }
                      options={
                        data.options
                      }
                      showCorps
                      onSave={
                        async values=>{
                          try{
                            setError("");
                            setSuccess("");

                            const refreshed=
                              await serverCall(
                                "modifierEffectif",
                                token,
                                {
                                  row:
                                    member.row,

                                  expectedPrenom:
                                    member.prenom,

                                  expectedNom:
                                    member.nom,

                                  grade:
                                    values.grade,

                                  corps:
                                    values.corps,

                                  specialite:
                                    values.specialite,

                                  status:
                                    values.status,

                                  assermente:
                                    values.assermente
                                }
                              );

                            setData(
                              refreshed
                            );

                            setSuccess(
                              `${member.nomComplet} a été mis à jour.`
                            );
                          }catch(e){
                            setError(
                              e.message
                            );
                          }
                        }
                      }
                    />
                  )}
                </div>
              </section>
            )}
          </div>
        </section>
      }
    </>
  );
}


function NouvelEffectifForm({
  options,
  initialCorps,
  onSubmit
}){
  const active=
    options.statuses.find(
      value=>
        normalizeSearchText(value)===
        normalizeSearchText(
          "En service actif"
        )
    );

  const[form,setForm]=useState({
    prenom:"",
    nom:"",
    grade:
      options.grades[0]||"",
    corps:
      initialCorps||
      options.corps[0]||"",
    specialite:"",
    status:
      active||
      options.statuses[0]||"",
    assermente:false
  });

  const[saving,setSaving]=
    useState(false);

  async function submit(e){
    e.preventDefault();

    try{
      setSaving(true);
      await onSubmit(form);
    }finally{
      setSaving(false);
    }
  }

  return(
    <form
      className="form-card"
      onSubmit={submit}
    >
      <h2>
        Nouveau membre
      </h2>

      <div className="form-grid">
        <Field label="Prénom">
          <input
            value={form.prenom}
            onChange={e=>
              setForm({
                ...form,
                prenom:e.target.value
              })
            }
          />
        </Field>

        <Field label="Nom">
          <input
            value={form.nom}
            onChange={e=>
              setForm({
                ...form,
                nom:e.target.value
              })
            }
          />
        </Field>

        <Field label="Grade">
          <select
            required
            value={form.grade}
            style={
              effectifsStyle(
                options
                  .styles
                  ?.grades
                  ?.[form.grade],
                {}
              )
            }
            onChange={e=>
              setForm({
                ...form,
                grade:e.target.value
              })
            }
          >
            <option value="">
              Sélectionner…
            </option>

            {options.grades.map(
              value=>
                <option
                  key={value}
                  value={value}
                >
                  {value}
                </option>
            )}
          </select>
        </Field>

        <Field label="Corps de garde">
          <select
            required
            value={form.corps}
            style={
              effectifsStyle(
                options
                  .styles
                  ?.corps
                  ?.[form.corps],
                {}
              )
            }
            onChange={e=>
              setForm({
                ...form,
                corps:e.target.value
              })
            }
          >
            <option value="">
              Sélectionner…
            </option>

            {options.corps.map(
              value=>
                <option
                  key={value}
                  value={value}
                >
                  {value}
                </option>
            )}
          </select>
        </Field>

        <Field label="Spécialité">
          {options.specialites.length>0
            ?(
              <select
                value={form.specialite}
                style={
                  effectifsStyle(
                    options
                      .styles
                      ?.specialites
                      ?.[form.specialite],
                    {}
                  )
                }
                onChange={e=>
                  setForm({
                    ...form,
                    specialite:
                      e.target.value
                  })
                }
              >
                <option value="">
                  Aucune / non renseignée
                </option>

                {options.specialites.map(
                  value=>
                    <option
                      key={value}
                      value={value}
                    >
                      {value}
                    </option>
                )}
              </select>
            )
            :(
              <input
                value={form.specialite}
                onChange={e=>

                      e.target.value

            )

        <Field label="Statut">

                  value={value}

                </option>

        </Field>

        <div className="field">
          <label>

          </label>

            <input

                setForm({
                  ...form,
                  assermente:
                    e.target.checked
                })
              }
            />

            Assermenté
          </label>
        </div>
      </div>

      <div className="form-actions">
        <button
          className="primary-button"
          disabled={saving}
        >
          {saving
            ?"Enregistrement..."
            :"Ajouter le membre"
          }
        </button>
      </div>
    </form>
  );
}


function EffectifCard({
  member,
  options,
  onSave,
  showCorps=false
}){
  const[editing,setEditing]=
    useState(false);

  const[grade,setGrade]=
    useState(member.grade);

  const[corps,setCorps]=
    useState(member.corps);

  const[specialite,setSpecialite]=
    useState(
      member.specialite||""
    );

  const[status,setStatus]=
    useState(member.status);

  const[assermente,setAssermente]=
    useState(
      member.assermente
    );

  const[saving,setSaving]=
    useState(false);

  useEffect(()=>{
    setGrade(
      member.grade
    );

    setCorps(
      member.corps
    );

    setSpecialite(
      member.specialite||""
    );

    setStatus(
      member.status
    );

    setAssermente(
      member.assermente
    );
  },[
    member.grade,
    member.corps,
    member.specialite,
    member.status,
    member.assermente
  ]);

  const changed=
    grade!==member.grade||
    corps!==member.corps||
    specialite!==(member.specialite||"")||
    status!==member.status||
    assermente!==member.assermente;

  async function save(){
    try{
      setSaving(true);

      await onSave({
        grade,
        corps,
        specialite,
        status,
        assermente
      });

      setEditing(false);
    }finally{
      setSaving(false);
    }
  }

  function cancel(){
    setGrade(
      member.grade
    );

    setCorps(
      member.corps
    );

    setSpecialite(
      member.specialite||""
    );

    setStatus(
      member.status
    );

    setAssermente(
      member.assermente
    );

    setEditing(false);
  }

  return(
    <article className="effectif-row">
      <div className="effectif-identity">
        <div className="effectif-name">
          {member.nomComplet}
        </div>

        <div className="effectif-badges">
          {showCorps&&member.corps&&
            <span
              className="effectif-badge"
              style={
                effectifsStyle(
                  member
                    .styles
                    ?.corps,
                  {}
                )
              }
            >
              {member.corps}
            </span>
          }

          {member.specialite&&
            <span
              className="effectif-badge"
              style={
                effectifsStyle(
                  member
                    .styles
                    ?.specialite,
                  {}
                )
              }
            >
              {member.specialite}
            </span>
          }

          <span
            className="effectif-badge"
            style={
              effectifsStyle(
                member
                  .styles
                  ?.status,
                {}
              )
            }
          >
            {member.status||
              "Sans statut"
            }
          </span>

          <span
            className={
              `effectif-badge ${
                member.assermente
                  ?"effectif-badge-sworn"
                  :"effectif-badge-muted"
              }`
            }
          >
            {member.assermente
              ?"✓ Assermenté"
              :"Non assermenté"
            }
          </span>
        </div>
      </div>

      {!editing&&
        <button
          type="button"
          className="secondary-button effectif-edit-button"
          onClick={()=>
            setEditing(true)
          }
        >
          Modifier
        </button>
      }

      {editing&&
        <div className="effectif-editor">
          <div className="field">
            <label>
              Grade
            </label>

            <select
              value={grade}
              style={
                effectifsStyle(
                  options
                    .styles
                    ?.grades
                    ?.[grade],
                  {}
                )
              }
              onChange={e=>
                setGrade(
                  e.target.value
                )
              }
            >
              {options.grades.map(
                value=>
                  <option
                    key={value}
                    value={value}
                  >
                    {value}
                  </option>
              )}
            </select>
          </div>

          <div className="field">
            <label>
              Corps
            </label>

            <select
              value={corps}
              style={
                effectifsStyle(
                  options
                    .styles
                    ?.corps
                    ?.[corps],
                  {}
                )
              }
              onChange={e=>
                setCorps(
                  e.target.value
                )
              }
            >
              {options.corps.map(
                value=>
                  <option
                    key={value}
                    value={value}
                  >
                    {value}
                  </option>
              )}
            </select>
          </div>

          <div className="field">
            <label>
              Spécialité
            </label>

            {options.specialites.length>0
              ?(
                <select
                  value={
                    specialite
                  }
                  style={
                    effectifsStyle(
                      options
                        .styles
                        ?.specialites
                        ?.[specialite],
                      {}
                    )
                  }
                  onChange={e=>
                    setSpecialite(
                      e.target.value
                    )
                  }
                >
                  <option value="">
                    Aucune
                  </option>

                  {specialite &&
                    !options
                      .specialites
                      .includes(
                        specialite
                      ) &&
                    <option
                      value={
                        specialite
                      }
                    >
                      {specialite}
                    </option>
                  }

                  {options.specialites.map(
                    value=>
                      <option
                        key={value}
                        value={value}
                      >
                        {value}
                      </option>
                  )}
                </select>
              )
              :(
                <input
                  value={
                    specialite
                  }
                  onChange={e=>
                    setSpecialite(
                      e.target.value
                    )
                  }
                />
              )
            }
          </div>

          <div className="field">
            <label>
              Statut
            </label>

            <select
              value={status}
              style={
                effectifsStyle(
                  options
                    .styles
                    ?.statuses
                    ?.[status],
                  {}
                )
              }
              onChange={e=>
                setStatus(
                  e.target.value
                )
              }
            >
              {options.statuses.map(
                value=>
                  <option
                    key={value}
                    value={value}
                  >
                    {value}
                  </option>
              )}
            </select>
          </div>

          <label className="effectif-check effectif-editor-check">
            <input
              type="checkbox"
              checked={
                assermente
              }
              onChange={e=>
                setAssermente(
                  e.target.checked
                )
              }
            />

            Assermenté
          </label>

          <div className="effectif-editor-actions">
            <button
              type="button"
              className="secondary-button"
              onClick={cancel}
              disabled={saving}
            >
              Annuler
            </button>

            <button
              type="button"
              className="primary-button"
              disabled={
                !changed||
                saving
              }
              onClick={save}
            >
              {saving
                ?"Enregistrement..."
                :"Enregistrer"
              }
            </button>
          </div>
        </div>
      }
    </article>
  );
}

||"—"}</td><td><button className="law-link" onClick={()=>openLaw(i.infraction)}>{i.infraction} ⓘ</button></td><td>{i.duree||"À déterminer"}</td><td>{i.entree}</td><td>{i.sortie||"—"}</td><td className="cell-center"><input type="checkbox" checked={i.libere} onChange={async e=>{try{setData(await serverCall("modifierPrisonLibere",token,i.row,e.target.checked));}catch(x){setError(x.message);}}}/></td><td>{i.saisies||"—"}</td><td>{i.notes||"—"}</td>{canDelete&&<td><button className="danger-button" disabled={deletingRow===i.row} onClick={()=>del(i)}>{deletingRow===i.row?"...":"Supprimer"}</button></td>}</tr>)}</tbody></table></div></div><LawModal article={selected} onClose={()=>setSelected(null)} onOpenCodex={onOpenCodex}/></>}
function PrisonForm({data,onSubmit,onOpenLaw}){
  const now=new Date(),local=new Date(now.getTime()-now.getTimezoneOffset()*60000);
  const[form,setForm]=useState({date:local.toISOString().slice(0,10),garde:"",detenu:"",cellule:"",infraction:"",entree:local.toISOString().slice(0,16),saisies:"",notes:""});
  const[submitting,setSubmitting]=useState(false);
  const submittingRef=useRef(false);
  const selected=data.infractions.find(i=>i.label===form.infraction);

  async function submit(e){
    e.preventDefault();

    if(submittingRef.current){
      return;
    }

    submittingRef.current=true;
    setSubmitting(true);

    try{
      await onSubmit(form);
    }finally{
      submittingRef.current=false;
      setSubmitting(false);
    }
  }

  return <form className="form-card" onSubmit={submit}><fieldset className="form-fieldset" disabled={submitting}><h2>Nouvelle incarcération</h2><div className="form-grid"><Field label="Date"><input type="date" required value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field><Field label="Garde"><select required value={form.garde} onChange={e=>setForm({...form,garde:e.target.value})}><option value="">Sélectionner…</option>{data.gardes.map(g=><option key={g}>{g}</option>)}</select></Field><Field label="Détenu"><input required value={form.detenu} onChange={e=>setForm({...form,detenu:e.target.value})}/></Field><Field label="Cellule"><input value={form.cellule} onChange={e=>setForm({...form,cellule:e.target.value})}/></Field><div className="field field-wide"><label>Infraction</label><select required value={form.infraction} onChange={e=>setForm({...form,infraction:e.target.value})}><option value="">Sélectionner…</option>{data.infractions.map(i=><option key={i.label} value={i.label}>{i.label}</option>)}</select>{form.infraction&&<div className="law-info-row"><button type="button" className="law-info-button" onClick={()=>onOpenLaw(form.infraction)}>ⓘ Consulter cet article</button></div>}</div><Field label="Durée prévue"><input readOnly value={!selected?"":selected.duree===""?"À déterminer":formatHours(selected.duree)}/></Field><Field label="Heure d'entrée"><input type="datetime-local" required value={form.entree} onChange={e=>setForm({...form,entree:e.target.value})}/></Field><div className="field field-full"><label>Saisies sur la personne</label><textarea value={form.saisies} onChange={e=>setForm({...form,saisies:e.target.value})}/></div><div className="field field-full"><label>Motif / Notes</label><textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/></div></div><div className="form-actions"><button type="submit" className="primary-button">{submitting?"Enregistrement…":"Enregistrer"}</button></div></fieldset></form>;
}
function Field({label,children}){return<div className="field"><label>{label}</label>{children}</div>;}

function PresenceOfficerDashboard({token}){const[data,setData]=useState(null),[error,setError]=useState("");useEffect(()=>{serverCall("getPresenceOfficerDashboard",token).then(setData).catch(e=>setError(e.message));},[]);if(error)return<div className="error">{error}</div>;if(!data)return<div className="loading">Chargement du tableau de bord...</div>;return <><div className="presence-dashboard-cards"><Stat label={`Coût anticipé — semaine ${data.currentWeek}`} value={formatSeptims(data.currentWeekTotal)}/><Stat label="Déjà réglé cette semaine" value={formatSeptims(data.currentWeekPaid)} sub={`Reste : ${formatSeptims(data.currentWeekRemaining)}`}/><Stat label="Impayés des semaines passées" value={data.pastUnpaidCount} warning/><Stat label="Montant total des impayés" value={formatSeptims(data.pastUnpaidAmount)} danger/></div><div className="presence-inactive-panel"><div className="presence-inactive-header"><strong>Gardes à surveiller</strong><span>{data.inactive.length}</span></div><div className="presence-inactive-list">{data.inactive.map((g,i)=><div className="presence-inactive-person" key={i}><div className="presence-inactive-name">{g.nomComplet}</div><div className="presence-inactive-meta">{[g.grade,g.corps].filter(Boolean).join(" — ")}</div><div className="presence-inactive-alert">{g.jamaisPresent?"Jamais présent dans le registre":`Dernière présence : ${g.dernierePresence} (${g.joursDepuis} jours)`}</div></div>)}</div></div></>}
function Stat({label,value,sub,warning,danger}){return<div className={`presence-stat-card ${warning?"presence-stat-warning":""} ${danger?"presence-stat-danger":""}`}><div className="presence-stat-label">{label}</div><div className="presence-stat-value">{value}</div>{sub&&<div className="presence-stat-sub">{sub}</div>}</div>;}
function PresencesPage({token,canEdit}){const[data,setData]=useState(null),[error,setError]=useState("");useEffect(()=>{serverCall("getPresences",token).then(setData).catch(e=>setError(e.message));},[]);if(error)return<div className="error">Erreur de chargement des présences : {error}</div>;if(!data)return<div className="loading">Chargement des présences...</div>;const weeks=new Map();data.rows.forEach(r=>{if(!weeks.has(r.semaine))weeks.set(r.semaine,[]);weeks.get(r.semaine).push(r);});return <><div className="page-header"><div><h1 className="page-title">Présences</h1><p className="page-subtitle">Suivi des présences et des soldes.</p></div></div>{canEdit&&<PresenceOfficerDashboard token={token}/>} {!canEdit&&<div className="readonly-notice">🔒 Consultation en lecture seule — seuls les officiers peuvent modifier les présences et le règlement des soldes.</div>}{[...weeks.entries()].sort((a,b)=>b[0]-a[0]).map(([w,r])=><WeekSection key={w} week={w} rows={r} currentWeek={data.currentWeek} canEdit={canEdit} token={token} onRefresh={setData}/>)}</>}
function WeekSection({week,rows,currentWeek,canEdit,token,onRefresh}){const groups=new Map();rows.forEach(r=>{const k=r.corps||"Sans corps";if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r);});const current=Number(week)===Number(currentWeek);return<section className={`week-section ${current?"week-current":"week-old"}`}><div className="week-header"><span>Semaine {week}</span>{current&&<span>Semaine courante</span>}</div>{[...groups.entries()].map(([corps,soldiers])=><div key={corps}><div className="corps-title">{corps}</div><div className="presence-table-wrap"><table className="presence-table"><thead><tr><th>Garde</th>{["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(d=><th key={d}>{d}</th>)}<th>Jours</th><th>Solde</th><th>Payé</th></tr></thead><tbody>{soldiers.map(s=><tr key={s.row} className={current?"row-current":s.paye?"row-paid":s.soldeRaw>0?"row-unpaid":""}><td><strong>{s.prenom} {s.nom}</strong><div className="grade">{s.grade}</div></td>{s.jours.map((c,i)=><td key={i}><input type="checkbox" checked={c} disabled={!canEdit} onChange={async e=>onRefresh(await serverCall("modifierPresence",token,s.row,6+i,e.target.checked))}/></td>)}<td>{s.joursPresents}</td><td>{s.solde}</td><td><input type="checkbox" checked={s.paye} disabled={!canEdit} onChange={async e=>onRefresh(await serverCall("modifierPresence",token,s.row,15,e.target.checked))}/></td></tr>)}</tbody></table></div></div>)}</section>}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
