  <style>/* ui/src/styles.css */
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family:
    Inter,
    Arial,
    sans-serif;
  background: #f3f3f3;
  color: #222;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
.app {
  min-height: 100vh;
}
.saisies-field h3 {
  font-size: 15px;
  margin: 4px 0 12px;
}
.saisie-shortcuts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.field .saisie-free-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 12px 0;
}
.field .saisie-free-toggle input {
  width: 18px;
  min-height: 18px;
  margin: 0;
}
.saisie-controls {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  flex-wrap: wrap;
}
.saisie-search {
  position: relative;
  flex: 1 1 300px;
  min-width: 0;
}
.saisie-quantity {
  flex: 0 1 140px;
}
.saisie-controls button {
  min-height: 40px;
}
.saisie-suggestions {
  position: absolute;
  z-index: 20;
  left: 0;
  right: 0;
  top: 100%;
  max-height: 300px;
  overflow: auto;
  margin: 4px 0 0;
  padding: 0;
  list-style: none;
  border: 1px solid #999;
  border-radius: 7px;
  background: white;
  box-shadow: 0 8px 20px #0002;
}
.saisie-suggestions li {
  padding: 10px 12px;
  cursor: pointer;
  border-bottom: 1px solid #eee;
  overflow-wrap: anywhere;
}
.saisie-suggestions li:hover,
.saisie-suggestions li.active {
  background: #e8eef5;
}
.saisie-suggestions span,
.saisies-list small {
  display: block;
  margin-top: 4px;
  color: #555;
  font-size: 12px;
  overflow-wrap: anywhere;
}
.saisie-help {
  font-size: 12px;
  color: #555;
  margin: 8px 0;
}
.saisies-list {
  list-style: none;
  padding: 0;
  margin: 12px 0 0;
  display: grid;
  gap: 6px;
}
.saisies-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  border: 1px solid #ddd;
  background: #fafafa;
  border-radius: 7px;
  padding: 9px 12px;
}
.saisies-cell {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
@media (max-width: 600px) {
  .saisie-search {
    flex-basis: 100%;
  }
  .saisie-quantity {
    flex: 1;
  }
  .saisies-list li {
    align-items: flex-start;
  }
}
.login-page {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
  background:
    linear-gradient(
      135deg,
      #ded7c5,
      #f3efe4);
}
.login-card {
  width: 100%;
  max-width: 420px;
  background: #fff;
  border-radius: 14px;
  padding: 28px;
  box-shadow: 0 10px 35px rgba(0, 0, 0, .12);
}
.login-card input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border: 1px solid #bbb;
  border-radius: 7px;
}
.primary-button,
.secondary-button,
.danger-button {
  border-radius: 7px;
  padding: 9px 12px;
}
.primary-button {
  border: 0;
  background: #333;
  color: #fff;
  padding: 11px 16px;
}
.secondary-button {
  border: 1px solid #aaa;
  background: #fff;
  color: #333;
}
.danger-button {
  border: 1px solid #c98282;
  background: #fff4f4;
  color: #a62d2d;
  font-size: 12px;
  font-weight: 700;
}
.primary-button:disabled,
.secondary-button:disabled,
.danger-button:disabled {
  opacity: .5;
  cursor: default;
}
.topbar {
  min-height: 64px;
  background: #242424;
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 22px;
  gap: 22px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand {
  font-weight: 700;
  white-space: nowrap;
}
.nav {
  display: flex;
  gap: 6px;
  flex: 1;
}
.nav button {
  border: 0;
  background: transparent;
  color: #ccc;
  padding: 10px 12px;
  border-radius: 6px;
  white-space: nowrap;
}
.nav button:hover,
.nav button.active {
  background: #444;
  color: #fff;
}
.external-link {
  color: #ddd;
  border: 1px solid #777;

}
.external-link:hover {
  background: #444;
  color: #fff;
}
.role-badge {
  font-size: 12px;
  padding: 5px 8px;
  border-radius: 20px;
  background: #555;
}
.logout {
  background: transparent;
  color: #ddd;
  border: 1px solid #777;
  border-radius: 6px;
  padding: 7px 10px;
}
.content {
  max-width: 1800px;
  margin: auto;
  padding: 24px;
}
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 20px;
}
.page-title {
  margin: 0;
}
.page-subtitle {
  margin: 5px 0 0;
  color: #777;
  font-size: 14px;
}
.loading {
  padding: 40px;
  text-align: center;
}
.error,
.success,
.info-notice,
.readonly-notice {
  padding: 10px 12px;
  border-radius: 7px;
  margin-bottom: 16px;
}
.error {
  background: #f4cccc;
  color: #8a0000;
}
.success {
  background: #e2f0d9;
  color: #35652f;
}
.info-notice,
.readonly-notice {
  background: #e8eef5;
  border: 1px solid #bcc9d8;
  color: #41566f;
  font-size: 13px;
}
.form-card {
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 24px;
}
.form-fieldset {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.field-wide {
  grid-column: span 2;
}
.field-full {
  grid-column: 1/-1;
}
.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 5px;
}
.field input,
.field select,
.field textarea {

  border-radius: 7px;
  background: #fff;
  padding: 8px 10px;
}
.field textarea {
  min-height: 85px;
  resize: vertical;
}
.form-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.registry {
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 12px;
  overflow: hidden;
}
.registry-table-wrap,
.presence-table-wrap {
  overflow-x: auto;
}
.registry-table,
.presence-table {
  width: 100%;

}
.registry-table {
  table-layout: fixed;

}
.registry-table th,
.registry-table td,
.presence-table th,
.presence-table td {
  padding: 9px;
  border-bottom: 1px solid #ececec;

}
.registry-table th,
.presence-table th {
  background: #f6f6f6;

}
.cell-center {

}
.actions-column {
  width: 90px;

}
.fine-unpaid {
  background: #f4cccc;
}
.fine-paid {
  background: #e5e5e5;
}
.fine-reversed {
  background: #e2f0d9;
}
.prison-table {
  min-width: 1650px;
}
.prison-active {
  background: #f4cccc;
}
.prison-released {
  background: #e5e5e5;
}
.law-link {
  border: 0;
  background: transparent;
  color: #315d8a;
  padding: 0;
  text-align: left;
  text-decoration: underline dotted;
  text-underline-offset: 3px;
}
.law-info-row {
  margin-top: 7px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.law-info-button {
  border: 1px solid #b7c4d0;
  background: #eef3f7;
  color: #35546d;

}
.modal-backdrop {
  position: fixed;

  justify-content: center;

}
.law-modal {
  width: min(820px, 100%);

  overflow-y: auto;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 25px 70px rgba(0, 0, 0, .35);
}
.law-modal-header {
  padding: 18px 20px;
  border-bottom: 1px solid #ddd;
  display: flex;
  justify-content: space-between;
  gap: 18px;
}
.law-modal-number {
  color: #666;
  font-size: 13px;
}
.law-modal-title {
  margin: 0;
  font-size: 21px;
}
.law-modal-close {
  border: 0;

  font-size: 27px;
  color: #777;
}
.law-modal-body {
  padding: 20px;
}
.law-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 18px;
}
.law-chip {
  display: inline-flex;
  border-radius: 30px;
  padding: 5px 9px;
  background: #ececec;
  color: #555;

}
.law-chip-local {
  background: #e6f0e6;
  color: #3f6542;
}
.law-source-info {
  border: 1px solid #ddd;
  background: #fafafa;
  border-radius: 9px;
  padding: 12px 14px;
  margin-bottom: 18px;
  font-size: 13px;
  line-height: 1.6;
}
.law-text {
  white-space: pre-wrap;
  line-height: 1.6;

}
.law-sanction-box {
  background: #f6f6f6;
  border-left: 4px solid #555;
  border-radius: 6px;
  padding: 13px 15px;
  margin-top: 14px;
}
.law-warning {
  margin-top: 16px;
  padding: 11px 13px;
  background: #fff2cc;
  border: 1px solid #e0cc80;
  border-radius: 7px;
  color: #6c5810;
}
.codex-library {
  display: grid;
  gap: 16px;
  margin-bottom: 20px;
}

  background: #fff;

  border-radius: 12px;
  padding: 15px;
}
.codex-family-title {
  margin: 0 0 12px;
  font-size: 16px;
}
.codex-source-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.codex-source-button {
  border: 1px solid #bbb;
  background: #f7f7f7;
  border-radius: 8px;
  padding: 8px 11px;

}
.codex-source-button.active {
  background: #333;
  border-color: #333;
  color: #fff;

  display: block;

}
.codex-controls {
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 12px;
  padding: 16px;

  display: grid;
  grid-template-columns: minmax(280px, 1fr) 210px 210px;
  gap: 12px;
}
.codex-controls input,
.codex-controls select {
  width: 100%;
  min-height: 42px;
  border: 1px solid #aaa;
  border-radius: 7px;
  padding: 8px 10px;
  background: #fff;
}
.codex-count {
  margin-bottom: 12px;
  color: #777;
  font-size: 13px;
}
.codex-list {
  display: grid;
  gap: 12px;
}
.codex-card {
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 11px;
  padding: 15px;
  cursor: pointer;
}
.codex-card-top {
  display: flex;
  justify-content: space-between;
  gap: 15px;
}
.codex-card-number {
  color: #777;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}
.codex-card-title {
  margin: 3px 0 6px;
  font-size: 17px;
}
.codex-card-source {
  color: #888;
  font-size: 11px;
  text-align: right;
}
.codex-card-text {
  margin-top: 10px;
  color: #555;
  font-size: 13px;

  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.codex-card-sanction {
  margin-top: 10px;
  color: #555;
  font-size: 12px;
  font-weight: 700;
}
.presence-dashboard-cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.presence-stat-card {
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 11px;
  padding: 15px;
}
.presence-stat-warning {
  background: #fff8e6;
}
.presence-stat-danger {
  background: #fff0f0;
}
.presence-stat-label {
  color: #666;
  font-size: 12px;
  margin-bottom: 7px;
}
.presence-stat-value {
  font-size: 25px;
  font-weight: 700;
}
.presence-stat-sub {
  margin-top: 7px;
  color: #888;
  font-size: 11px;
}
.presence-inactive-panel {
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 11px;
  overflow: hidden;
  margin-bottom: 28px;
}
.presence-inactive-header {
  display: flex;
  justify-content: space-between;
  padding: 12px 15px;
  background: #f5f5f5;
  border-bottom: 1px solid #ddd;
}
.presence-inactive-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
}
.presence-inactive-person {
  padding: 11px 14px;
  border-right: 1px solid #eee;
  border-bottom: 1px solid #eee;
}
.presence-inactive-name {
  font-weight: 700;
}
.presence-inactive-meta {
  color: #777;
  font-size: 12px;
}
.presence-inactive-alert {
  color: #995b19;
  font-size: 12px;
  font-weight: 700;
}
.week-section {
  margin-bottom: 34px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #ccc;
  background: #fff;
}
.week-header {
  padding: 13px 18px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
}
.week-current .week-header {
  background: #fff2cc;
}
.week-old .week-header {
  background: #e8e8e8;
}
.corps-title {
  padding: 9px 14px;
  font-weight: 700;
  background: #f6f6f6;
}
.presence-table {
  table-layout: fixed;
}
.presence-table th,
.presence-table td {
  text-align: center;
}
.presence-table th:first-child,
.presence-table td:first-child {
  width: 240px;
  text-align: left;
}
.row-current {
  background: #fff2cc !important;
}
.row-unpaid {
  background: #f4cccc !important;
}
.row-paid {
  background: #e1e1e1 !important;
}
.grade {
  font-size: 12px;
  opacity: .68;
}
.effectifs-toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.effectifs-search {
  flex: 1;
  min-width: 260px;
  min-height: 42px;
  border: 1px solid #aaa;
  border-radius: 7px;
  padding: 8px 11px;
  background: #fff;
}
.effectifs-count {
  color: #777;
  font-size: 13px;
}
.effectifs-grid {
  display: grid;
  gap: 10px;
}
.effectif-card {
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 11px;
  padding: 14px;
}
.effectif-card-head {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.effectif-name {
  font-weight: 700;
  font-size: 17px;
}
.effectif-meta {
  color: #777;
  font-size: 12px;
  margin-top: 3px;
}
.effectif-state {
  font-size: 11px;
  border-radius: 20px;
  padding: 5px 8px;
  background: #eee;

.effectif-state.active {
  background: #e2f0d9;
  color: #35652f;
}
.effectif-edit-grid {

  gap: 10px;
  align-items: end;
}
.effectif-check {
  min-height: 40px;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.effectif-check input {
  width: 18px;
  height: 18px;
}
.effectif-save {
  min-height: 40px;
}
@media (max-width: 1000px) {
  .presence-dashboard-cards {
    grid-template-columns: 1fr 1fr;
  }
  .effectif-edit-grid {
    grid-template-columns: 1fr 1fr;
  }
}
@media (max-width: 900px) {
  .codex-controls {
    grid-template-columns: 1fr;
  }
}
@media (max-width: 800px) {
  .topbar {
    flex-wrap: wrap;
    padding: 10px 14px;
  }
  .brand {
    width: 100%;
  }
  .nav {
    width: 100%;
    overflow-x: auto;
  }
  .content {
    padding: 12px;
  }
  .form-grid {
    grid-template-columns: 1fr;
  }
  .field-wide,
  .field-full {
    grid-column: auto;
  }
}
@media (max-width: 620px) {
  .presence-dashboard-cards,
  .effectif-edit-grid {
    grid-template-columns: 1fr;
  }
  .page-header {
    align-items: stretch;
    flex-direction: column;
  }
  .page-header .primary-button {
    width: 100%;
  }
}
.fine-recipient {
  margin-top: 4px;
  color: #666;
  font-size: 11px;
  line-height: 1.35;
}

  margin: 0 0 16px;

.effectifs-tabs {
  display: flex;

.effectifs-tab {

.changes-controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.changes-controls label {
  font-size: 13px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.changes-controls select,
.changes-controls input[type=search] {
  padding: 7px;
  border: 1px solid #b9b09c;
  border-radius: 6px;
  max-width: 100%;
}
.changes-list {
  list-style: none;
  padding: 0;
  margin: 12px 0 0;
  max-height: 420px;
  overflow-y: auto;
}
.changes-list li {
  padding: 12px 0;
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 12px;
  border-top: 1px solid #e4dfd0;
  font-size: 13px;
}
.changes-list small {
  display: block;
  color: #706955;
  margin: 4px 0;
}
.member-change {
  display: inline;
  margin-left: 8px;
  font-size: 12px;
  font-weight: 400;
}
.change-badge {
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 3px 9px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.change-new {
  background: #fff0bb;
  border-color: #c59628;
  color: #624700;
}
.change-seen {
  background: #eee;
  border-color: #ccc;
  color: #555;
}
.change-badge:focus-visible {
  outline: 2px solid #624700;
  outline-offset: 3px;
}
.change-badge:disabled {
  cursor: default;
  opacity: 1;
}
.change-details {
  display: block;
  background: #fffdf3;
  border-left: 3px solid #c59628;
  margin: 8px 0;
  padding: 6px 10px;
  text-align: left;
  color: #433b28;
  line-height: 1.5;
}
.change-detail {
  display: block;
  padding: 3px 0;
}
.change-detail small {
  display: block;
  color: #776c55;
  font-size: 11px;
}
.changes-count {
  display: inline-block;
  background: #fff0bb;
  color: #624700;
  border-radius: 10px;
  padding: 3px 7px;
  font-size: 11px;
  font-weight: 700;
  margin: 3px 5px;
  white-space: nowrap;
}
@media (max-width: 620px) {
  .changes-list li {
    flex-wrap: wrap;
  }
  .changes-controls {
    align-items: stretch;
    flex-direction: column;
  }
  .changes-controls input[type=search] {
    min-width: 0;
    width: 100%;
  }
}

/* ui/src/theme.css */
:root {
  --paper:#efe2c5;
  --surface:#fbf5e7;
  --ink:#34291f;
  --muted:#73614e;
  --line:#cfbb91;
  --gold:#9b722d;
  --leather:#32261e;
  --seal:#843a2e;
  --shadow:0 6px 24px #44331c0a;
  --sidebar:238px;
}
body {
  color: var(--ink);
  background-color: var(--paper);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%237e5d30' opacity='.065' filter='url(%23n)' d='M0 0h180v180H0z'/%3E%3C/svg%3E");
  font-family:
    "Segoe UI",
    Arial,
    sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
button,
a,
input,
select,
textarea,
summary {
  -webkit-tap-highlight-color: transparent;
}
button {
  transition:
    background .16s,
    color .16s,
    border-color .16s;
}
button:disabled {
  cursor: wait;
}
button:focus-visible,
a:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}
input:focus,
select:focus,
textarea:focus {
  outline: 2px solid var(--gold);
  outline-offset: 1px;
}
::selection {
  background: #d7b970;
  color: #2c2119;
}
input[type=checkbox] {
  accent-color: #755023;
  width: 20px;
  height: 20px;
  min-height: 20px;
  flex: none;
  cursor: pointer;
}
h1,
h2,
h3 {
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}
svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}
.skip-link {
  position: fixed;
  left: 16px;
  top: -100px;
  z-index: 1000;
  background: var(--surface);
  color: var(--ink);
  padding: 12px 20px;
}
.skip-link:focus {
  top: 12px;
}
.topbar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 100;
  width: var(--sidebar);
  height: 100dvh;
  min-height: 0;
  padding: 35px 18px 18px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 0;
  background:
    radial-gradient(
      ellipse at top left,
      #5b4530,
      transparent 70%),
    var(--leather);
  color: #f0e2c3;
  border-right: 1px solid #a17d43;
  box-shadow: 4px 0 20px #3325130c;
  overflow-y: auto;
}
.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 0 4px 30px;
  white-space: normal;
  border-bottom: 1px solid #c1a16440;
}
.brand-seal {
  display: grid;
  place-items: center;
  flex: none;
  width: 44px;
  height: 54px;
  color: #dfbf7a;
  border: 1px solid #b69351;
  border-radius: 50% 50% 44% 44%;
  box-shadow: inset 0 0 0 4px #32261e;
}
.brand-seal svg {
  width: 30px;
  height: 34px;
}
.brand-overline,
.brand-caption {
  display: block;
  color: #d0bb95;
  font-size: 10px;
  letter-spacing: .12em;
}
.brand strong {
  display: block;
  font-family: Georgia, serif;
  font-size: 24px;
  font-weight: 400;
  letter-spacing: .015em;
  line-height: 1.6;
}
.brand-caption {
  letter-spacing: .05em;
}
.nav-caption {
  margin: 30px 14px 12px;
  color: #c4ac83;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .22em;
}
.nav {
  display: flex;
  flex-direction: column;
  flex: 0;
  gap: 5px;
  width: 100%;
}
.nav button {
  display: flex;
  gap: 13px;
  align-items: center;
  min-height: 49px;
  padding: 12px 14px;
  border: 1px solid transparent;
  border-radius: 4px;
  color: #dacbae;
  font-size: 13px;
  text-align: left;
  white-space: normal;
}
.nav button svg {
  color: #c2a16a;
  width: 21px;
}
.nav button:hover {
  background: #ffffff0a;
  color: #fff2d3;
}
.nav button.active {
  color: #fff1ca;
  border-color: #b58b4255;
  background:
    linear-gradient(
      90deg,
      #a87d373d,
      #a87d3710);
  box-shadow: inset 3px 0 #cfab61;
}
.nav button.active svg {
  color: #e2bf73;
}
.nav-footer {
  margin-top: auto;
  padding-top: 28px;
}
.external-link {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 44px;
  border: 0;
  border-top: 1px solid #c1a16440;
  border-radius: 0;
  font-size: 12px;
  padding: 16px 12px;
  color: #d0bb95;
}
.external-link:hover {
  background: #ffffff08;
  color: #fff2d3;
}
.session-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  padding: 8px 4px;
}
.role-badge {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 12px;
  background: transparent;
  color: #e6d6b9;
  padding: 4px;
}
.session-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #d2b272;
}
.logout {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  padding: 8px;
  border: 1px solid #b1977044;
  color: #d9c7a5;
}
.logout:hover {
  background: #ffffff12;
}
.content {
  margin-left: var(--sidebar);
  max-width: none;
  min-width: 0;
  padding: 28px clamp(20px, 3.2vw, 58px) 60px;
}
.content:focus {
  outline: none;
}
.page-illustration {
  position: relative;
  max-width: 1450px;
  height: clamp(135px, 15vw, 220px);
  margin: 0 auto 30px;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
  text-align: center;
}
.page-illustration img {
  height: 100%;
  width: 100%;
  object-fit: contain;
  mix-blend-mode: multiply;
  opacity: .88;
  mask-image: linear-gradient(#000 80%, transparent);
}
.page-illustration span {
  position: absolute;
  bottom: 3px;
  left: 0;
  right: 0;
  display: block;
  text-align: center;
  text-transform: uppercase;
  font-size: 9px;
  letter-spacing: .25em;
  color: #806639;
}
.page-header {
  padding-bottom: 18px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
  align-items: center;
}
.page-title {
  font-size: clamp(26px, 2.8vw, 38px);
  font-weight: 400;
  letter-spacing: -.025em;
  line-height: 1.2;
  color: var(--ink);
}
.page-subtitle {
  color: var(--muted);
  line-height: 1.6;
  max-width: 750px;
}
.page-header > .primary-button {
  flex-shrink: 0;
}
.primary-button,
.secondary-button,
.danger-button,
.law-info-button {
  min-height: 44px;
  border-radius: 4px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
}
.primary-button {
  background: #634526;
  color: #fff7e6;
  border: 1px solid #634526;
  box-shadow: inset 0 1px #ffffff20, 0 2px 3px #4c321612;
}
.primary-button:hover {
  background: #49321e;
}
.secondary-button {
  background: #fbf5e7;
  color: #5e472a;
  border-color: var(--line);
}
.secondary-button:hover {
  background: #eee1c5;
  border-color: #aa8954;
}
.danger-button {
  background: #fbefea;
  color: #863a2d;
  border-color: #dfb4a7;
}
.law-info-button {
  color: #69491f;
  background: #f4ead3;
  border-color: #d9c499;
}
.law-link {
  color: #72501f;
  line-height: 1.5;
  min-height: 32px;
}
.form-card,
.registry,
.codex-family,
.codex-controls,
.codex-card,
.presence-stat-card,
.presence-inactive-panel,
.recent-changes {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 6px;
  box-shadow: var(--shadow);
}
.form-card {
  padding: 26px;
  margin-bottom: 28px;
  border-top: 3px double #b08d50;
}
.form-card h2 {
  margin: 0 0 22px;
  font-size: 24px;
  font-weight: 400;
}
.form-grid {
  gap: 20px;
}
.field {
  min-width: 0;
}
.field label {
  color: #634f36;
  font-size: 12px;
  line-height: 1.6;
  letter-spacing: .015em;
}
.field input,
.field select,
.field textarea,
.codex-controls input,
.codex-controls select,
.effectifs-search input,
.presence-week-filter input,
.presence-week-filter select,
.changes-controls input,
.changes-controls select {
  min-height: 46px;
  border: 1px solid #c7b594;
  background: #fffaf0;
  border-radius: 4px;
  color: var(--ink);
  padding: 11px 12px;
  max-width: 100%;
  font-size: 14px;
}
.field label input,
.field label select,
.field label textarea {
  margin-top: 6px;
}
.field label:has(input[type=checkbox]) {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 44px;
}
.field input[type=checkbox] {
  width: 20px;
  min-height: 20px;
  margin: 0;
  padding: 0;
}
.field input[readonly] {
  background: #eee5d1;
  color: #65553e;
  border-style: dashed;
}
.field textarea {
  min-height: 108px;
  line-height: 1.6;
}
.field > p {
  font-size: 13px;
  line-height: 1.7;
  color: #6a583f;
  padding: 12px 14px;
  background: #eee4cd;
  border-left: 2px solid #b4945b;
  border-radius: 2px;
  overflow-wrap: anywhere;
}
.form-actions {
  padding-top: 18px;
  border-top: 1px solid #e1d1b4;
  gap: 12px;
}
.error,
.success,
.info-notice,
.readonly-notice {
  padding: 14px 16px;
  border-radius: 4px;
  line-height: 1.6;
}
.error {
  background: #f9e6df;
  color: #7b3025;
  border: 1px solid #dfb7a7;
}
.success {
  background: #e9eddb;
  color: #42502d;
}
.info-notice,
.readonly-notice {
  background: #f2e8d1;
  border-color: #d2bd91;
  color: #705831;
}
.loading {
  padding: 70px 20px;
  color: #7e6742;
  font-family: Georgia, serif;
  font-size: 20px;
}
.registry-table th,
.presence-table th {
  background: #eee3c9;
  color: #705733;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: .06em;
  padding: 15px 12px;
  border-bottom: 1px solid #c8b386;
}
.registry-table td,
.presence-table td {
  padding: 14px 12px;
  border-bottom: 1px solid #ddd0b34d;
  font-size: 13px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}
.registry-table tr:last-child td {
  border-bottom: 0;
}
.registry-table-wrap,
.presence-table-wrap {
  overscroll-behavior-x: contain;
  scrollbar-color: #b69a65 #efe5ce;
}
.fine-unpaid,
.prison-active {
  background: #f7e8dd;
}
.fine-paid,
.prison-released {
  background: #ece7dc;
}
.fine-reversed {
  background: #edf0df;
}
.fine-recipient {
  font-size: 11px;
  line-height: 1.5;
  color: #6d6350;
  margin-top: 7px;
}
.registry-table tbody tr:hover {
  box-shadow: inset 3px 0 #a88445;
}
.registry input[type=checkbox],
.presence-table input[type=checkbox] {
  outline-offset: 6px;
}
.grade {
  font-size: 11px;
  color: #756144;
}
.week-section {
  border: 1px solid var(--line);
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 22px;
  background: var(--surface);
}
.week-header {
  background: #e8dcc0;
  color: #574128;
  padding: 17px 20px;
}
.week-current .week-header {
  background: #5b432c;
  color: #fff0ce;
}
.week-toggle {
  min-height: 56px;
  line-height: 1.5;
}
.corps-title {
  background: #f2e8d1;
  color: #5a472b;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
}
.presence-week-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  margin-bottom: 22px;
}
.presence-week-filter input {
  flex: 1;
  min-width: 180px;
}
.presence-table {
  min-width: 800px;
}
.presence-table th:first-child,
.presence-table td:first-child {
  position: sticky;
  left: 0;
  z-index: 2;
  background: #f9f0dc;
  min-width: 150px;
  max-width: 200px;
  box-shadow: 1px 0 #d1bd98;
}
.presence-table th:first-child {
  background: #eee3c9;
  z-index: 3;
}
.presence-dashboard-cards {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}
.presence-stat-card {
  padding: 20px;
  border-top: 2px solid #ac894c;
}
.presence-stat-label {
  color: #78613e;
  line-height: 1.6;
}
.presence-stat-value {
  font-family: Georgia, serif;
  font-size: 32px;
  color: #4d3821;
  font-weight: 400;
}
.presence-stat-sub {
  color: #75644c;
  line-height: 1.5;
}
.presence-stat-warning {
  background: #f5eaca;
}
.presence-stat-danger {
  background: #f5e4db;
}
.presence-inactive-header {
  background: #eee2c8;
}
.codex-family {
  padding: 20px;
}
.codex-family-title {
  font-size: 21px;
  font-weight: 400;
  color: #594023;
}
.codex-source-button {
  background: #f5ecd8;
  color: #635032;
  border: 1px solid #d2bd93;
  border-radius: 3px;
  min-height: 46px;
  padding: 10px 14px;
}
.codex-source-button.active {
  background: #634526;
  border-color: #634526;
  color: #fff3d4;
}
.codex-controls {
  padding: 20px;
  grid-template-columns: minmax(0, 1fr) minmax(150px, 220px) minmax(150px, 220px);
}
.codex-list {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}
.codex-card {
  padding: 22px;
  transition: box-shadow .18s, border-color .18s;
}
.codex-card:hover {
  border-color: #a68140;
  box-shadow: 0 8px 22px #50391c12;
}
.codex-card-number {
  color: #906c30;
  font-size: 10px;
  letter-spacing: .14em;
}
.codex-card-title {
  font-size: 22px;
  font-weight: 400;
  line-height: 1.3;
  margin: 8px 0 12px;
}
.codex-card-top {
  display: block;
}
.codex-card-source {
  text-align: left;
  color: #7f6e52;
  margin-top: 8px;
}
.codex-card-text {
  font-size: 14px;
  line-height: 1.7;
  color: #655641;
}
.codex-card-sanction {
  font-size: 12px;
  line-height: 1.6;
  color: #78552c;
  border-top: 1px solid #ddceb0;
  padding-top: 12px;
}
.law-chip {
  background: #eee4cd;
  color: #6b5637;
  border: 1px solid #ded0af;
  font-size: 11px;
}
.law-chip-local {
  background: #e6ead5;
  border-color: #cbd2b0;
  color: #50603a;
}
.law-modal {
  background: var(--surface);
  border: 1px solid #b1955f;
  border-radius: 6px;
  max-height: calc(100dvh - 48px);
}
.modal-backdrop {
  background: #281f18bb;
  backdrop-filter: blur(4px);
}
.law-modal-header {
  padding: 22px 26px;
  background: #eee1c4;
  border-bottom: 1px solid var(--line);
  align-items: center;
}
.law-modal-title {
  font-size: 28px;
  font-weight: 400;
  line-height: 1.3;
}
.law-modal-number {
  color: #846634;
  letter-spacing: .08em;
  font-size: 11px;
}
.law-modal-close {
  min-width: 44px;
  min-height: 44px;
  color: #705533;
  align-self: flex-start;
}
.law-modal-body {
  padding: 26px;
}
.law-text {
  font-family: Georgia, serif;
  font-size: 17px;
  line-height: 1.85;
  color: #463625;
}
.law-source-info {
  background: #f0e6cf;
  border-color: var(--line);
  color: #6b5739;
}
.law-sanction-box {
  background: #f0e3c6;
  border-color: #987130;
  color: #654823;
  line-height: 1.7;
  white-space: pre-wrap;
}
.law-warning {
  background: #f6e9c1;
  border-color: #d6b674;
  color: #765a23;
}
.effectifs-toolbar,
.effectifs-toolbar-v3 {
  background: var(--surface);
  border-color: var(--line);
  border-radius: 6px;
  box-shadow: var(--shadow);
  gap: 14px;
}
.effectifs-tabs {
  gap: 8px;
  scrollbar-color: #b69a65 #efe5ce;
}
.effectifs-tab {
  min-height: 46px;
  border-radius: 4px;
  border-color: var(--line);
  background: #f7efdf;
  color: #675032;
}
.effectifs-tab.active {
  background: #654a2b;
  color: #fff1d1;
  border-color: #654a2b;
}
.effectifs-corps-heading {
  border-color: var(--line);
}
.effectifs-corps-title {
  font-family: Georgia, serif;
  color: #5c4227;
  font-size: 25px;
}
.effectifs-grade-heading {
  border-color: var(--line);
  color: #7d633c;
}
.effectif-card {
  background: var(--surface);
  border-color: #d7c5a3;
  border-radius: 5px;
  box-shadow: var(--shadow);
}
.effectif-name {
  font-family: Georgia, serif;
  font-size: 19px;
  color: #493521;
}
.effectif-meta {
  color: #79664d;
  line-height: 1.6;
}
.effectif-edit-button {
  min-width: 44px;
  min-height: 44px;
  color: #72532b;
  border-color: var(--line);

  color: #7d6848;
  font-size: 12px;
}
.effectifs-page .effectifs-search {
  width: min(460px, 100%);
  min-height: 48px;
  padding: 12px 16px;
  border: 1px solid #bfa575;
  border-radius: 3px;
  background: #fbf3e2;
  font-size: 14px;
  color: #4d3923;
  box-shadow: inset 0 2px 4px #69482008;
}
.effectifs-page .effectifs-corps-groups {
  gap: 34px;
}
.effectifs-page .effectifs-corps-group {
  padding: 24px;
  border: 1px solid #c9af7d;
  border-radius: 3px;
  background: #f5ead245;
  gap: 22px;
}
.effectifs-page .effectifs-corps-heading {
  position: relative;
  display: flex;
  align-items: center;
  padding: 0 0 18px 18px;
  border-left-width: 3px;
  border-bottom: 3px double #c3a36d;
  min-height: 78px;
}
.effectifs-page .effectifs-corps-title {
  font-family: Georgia, serif;
  font-weight: 400;
  font-size: 29px;
  line-height: 1.3;
  color: #513820;
}
.effectifs-page .effectifs-corps-title:before {
  content: "Corps de garde";
  display: block;
  font: 9px/1.5 "Segoe UI", sans-serif;
  text-transform: uppercase;
  letter-spacing: .2em;
  color: #997442;
  margin-bottom: 6px;
}
.effectifs-page .effectifs-corps-subtitle {
  font-size: 12px;
  color: #806b49;
  margin-top: 5px;
}
.effectifs-page .effectifs-grade-groups {
  gap: 22px;
}
.effectifs-page .effectifs-grade-group {
  background: transparent;
  border: 0;
  border-radius: 0;
  overflow: visible;
}
.effectifs-page .effectifs-grade-heading {
  background: transparent;
  border: 0;
  min-height: 36px;
  padding: 0 0 10px;
  color: #75552d;
  font-weight: 500;
  font-family: Georgia, serif;
  font-size: 18px;
  gap: 10px;
}
.effectifs-page .effectifs-grade-heading:before {
  content: "";
  width: 9px;
  height: 9px;
  flex: none;
  background: var(--member-accent,#ad8846);
  border: 1px solid #9a7f5044;
  transform: rotate(45deg);
}
.effectifs-page .effectifs-grade-heading > span:first-of-type {
  margin-right: auto;
}
.effectifs-page .effectifs-grade-count {
  border: 0;
  background: transparent;
  color: #967a4e;
  font: 12px/1.4 "Segoe UI", sans-serif;
  min-width: 0;
  padding: 0;
}
.effectifs-page .effectifs-grade-count:after {
  content: " membre(s)";
  font-size: 10px;
}
.effectifs-page .effectifs-member-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.effectifs-page .effectif-row {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) auto;
  align-items: start;
  gap: 14px;
  padding: 20px 16px;
  background: #fbf3e1;
  border: 1px solid #d7c19a;
  border-radius: 3px;
  box-shadow: 0 3px 10px #6c491008;
  min-width: 0;
}
.effectifs-page .effectif-row:hover {
  background: #fff7e8;
  border-color: #b89a62;
}
.effectifs-page .effectif-row.is-editing {
  grid-column: 1/-1;
  border-color: #a58043;
}
.effectif-monogram {
  display: grid;
  place-items: center;
  width: 42px;
  height: 46px;
  border: 1px solid #b9975c;
  box-shadow: inset 0 0 0 3px #f9eed7;
  background: #e8d7b0;
  color: #7a5427;
  font: 17px Georgia, serif;
  border-radius: 40% 40% 45% 45%;
}
.effectifs-page .effectif-name {
  font-family: Georgia, serif;
  font-size: 20px;
  font-weight: 400;
  line-height: 1.4;
  margin-bottom: 10px;
  color: #49321d;
  overflow-wrap: anywhere;
}
.effectifs-page .effectif-badges {
  gap: 6px;
  align-items: flex-start;
}
.effectifs-page .effectif-badge {
  border-radius: 2px;
  border: 0;
  border-left: 2px solid var(--member-accent,#bfa473);
  background: #eee1c65e;
  color: #76603c;
  padding: 4px 7px;
  min-height: 24px;
  font-size: 10px;
  line-height: 1.5;
  white-space: normal;
  overflow-wrap: anywhere;
}
.effectifs-page .effectif-badge-sworn {
  border-left-color: #798353;
  background: #e8e9d45e;
  color: #5c633e;
}
.effectifs-page .effectif-badge-muted {
  color: #968165;
  border-left-color: #cbbba0;
  background: transparent;
}
.effectifs-page .effectif-edit-button {
  min-width: 0;
  width: auto;
  min-height: 44px;
  padding: 9px 11px;
  font-size: 11px;
  background: transparent;
  border-color: #d5c098;
  color: #836036;
  border-radius: 3px;
  align-self: start;
}
.effectifs-page .effectif-edit-button:hover {
  background: #ead9b5;
  color: #563b1e;
  border-color: #ab864b;
}
.effectifs-page .effectif-editor {
  grid-column: 1/-1;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  padding: 20px 0 0;
  margin-top: 4px;
  border: 0;
  border-top: 3px double #ccb184;
  background: transparent;
  gap: 16px;
}
.effectifs-page .effectif-editor .field {
  min-width: 0;
}
.effectifs-page .effectif-editor select,
.effectifs-page .effectif-editor input:not([type=checkbox]),
.effectifs-page .form-card select {
  background: #fff9ed;
  color: #594024;
  border: 1px solid #c7af85;
  border-left: 3px solid var(--member-accent,#bda170);
  border-radius: 3px;
  min-height: 46px;
  font-size: 14px;
}
.effectifs-page .effectif-editor-check {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #79613c;
}
.effectifs-page .effectif-editor-check input {
  width: 20px;
  min-height: 20px;
  margin: 0;
}
.effectifs-page .effectif-editor-actions {
  justify-content: flex-end;
  gap: 10px;
}
.effectifs-page .effectif-editor-actions button {
  min-height: 44px;
}
.effectifs-page .effectifs-reserve-group {
  padding-top: 20px;
  border-top: 1px dashed #c4aa7c;
  background: transparent;
}
.effectifs-page .effectifs-reserve-group .effectifs-grade-heading {
  background: transparent;
  color: #897654;
}
.effectifs-page .effectifs-empty {
  background: #f8efdc;
  border: 1px dashed #c3aa7d;
  border-radius: 3px;
  color: #87704a;
  font-family: Georgia, serif;
  padding: 28px;
}
.effectifs-page .effectifs-archives {
  border-color: #c9ae7b;
  padding-top: 28px;
}
.effectifs-page .effectifs-archives-title {
  font: 27px Georgia, serif;
  color: #65492b;
}
.effectifs-page .effectifs-archives-subtitle {
  color: #877350;
}
.effectifs-page .effectifs-terminal-groups {
  gap: 18px;
}
.effectifs-page .effectifs-terminal-group {
  border: 1px solid #cfb995;
  border-radius: 3px;
  background: #ece1cd;
}
.effectifs-page .effectifs-terminal-heading {
  padding: 15px 18px;
  background: #e7d7bb;
  color: #725c3e;
  border-bottom: 1px solid #c8af82;
  font-family: Georgia, serif;
  font-weight: 400;
  font-size: 20px;
}
.effectifs-page .effectifs-terminal-group .effectifs-member-list {
  padding: 12px;
}
@media (max-width: 1200px) {
  .effectifs-page .effectifs-member-list {
    grid-template-columns: minmax(0, 1fr);
  }
  .effectifs-overview > div {
    padding: 18px 16px;
  }
  .effectifs-overview strong {
    font-size: 32px;
  }
}
@media (max-width: 600px) {
  .effectifs-overview {
    gap: 0;
  }
  .effectifs-overview > div {
    display: flex;
    flex-direction: column;
    padding: 14px 10px;
    gap: 7px;
  }
  .effectifs-overview span {
    font-size: 8px;
    letter-spacing: .05em;
    align-self: flex-start;
  }
  .effectifs-overview strong {
    font-size: 30px;
    align-self: flex-start;
  }
  .effectifs-overview small {
    font-size: 11px;
    line-height: 1.4;
  }
  .effectifs-page .effectifs-tabs {
    flex-wrap: nowrap;
    overflow-x: auto;
    max-width: 100%;
    padding: 0 0 12px;
    margin: 20px 0 10px;
  }
  .effectifs-page .effectifs-tab {
    white-space: nowrap;
    min-height: 46px;
    padding: 9px 12px;
  }
  .effectifs-page .effectifs-search {
    width: 100%;
    font-size: 16px;
  }
  .effectifs-page .effectifs-toolbar-v3 {
    padding-bottom: 18px;
    margin-bottom: 20px;
  }
  .effectifs-page .effectifs-corps-group {
    padding: 18px 12px;
    gap: 16px;
  }
  .effectifs-page .effectifs-corps-heading {
    padding-left: 12px;
  }
  .effectifs-page .effectifs-corps-title {
    font-size: 25px;
  }
  .effectifs-page .effectif-row {
    grid-template-columns: 34px minmax(0, 1fr);
    padding: 15px 12px;
    gap: 10px;
  }
  .effectif-monogram {
    width: 34px;
    height: 40px;
    font-size: 14px;
  }
  .effectifs-page .effectif-name {
    font-size: 20px;
  }
  .effectifs-page .effectif-edit-button {
    grid-column: 2;
    justify-self: start;
    min-height: 44px;
    padding: 8px 14px;
  }
  .effectifs-page .effectif-editor {
    grid-template-columns: minmax(0, 1fr);
    gap: 16px;
  }
  .effectifs-page .effectif-editor select,
  .effectifs-page .effectif-editor input:not([type=checkbox]),
  .effectifs-page .form-card select {
    font-size: 16px;
    min-height: 48px;
  }
  .effectifs-page .effectif-editor-actions {
    display: flex;
  }
  .effectifs-page .effectifs-terminal-group .effectifs-member-list {
    padding: 8px;
  }
}
.nav-label-mobile {
  display: none;
}
.registry-footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 36px;
  padding: 18px 0 0;
  border-top: 3px double var(--line);
  color: #7c6646;
  font-size: 11px;
  letter-spacing: .05em;
}
.registry-footer a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  color: #745427;
  text-underline-offset: 4px;
}
@media (max-width: 900px) {
  .nav-label-mobile {
    display: block;
  }
  .nav-label-full {
    display: none;
  }
}

        #000 35%,
        transparent 72%);

}

  *,
  *:before,
  *:after {
    transition: none !important;
    animation: none !important;

}</style>
